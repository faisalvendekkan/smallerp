name: Tests

# The suite has no Composer dependencies, so CI is just "install PHP, run it".
# It gates deployment: deploy.yml will not ship a build whose tests fail.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:      # so deploy.yml can require this before shipping

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor the app advertises; 8.2/8.3 are what Hostinger
        # shared hosting offers today, so all three have to stay green.
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Check the syntax of every PHP file
        run: |
          find . -path ./.git -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run the test suite
        run: php tests/run.php

      - name: Boot the app and smoke-test the routes
        run: |
          php -S 127.0.0.1:8123 -t public > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8123/login && break
            sleep 0.5
          done
          # A fresh checkout has no database, so the installer must answer.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/)
          echo "GET / returned $code"
          test "$code" = "200"
          cat /tmp/server.log | tail -5
